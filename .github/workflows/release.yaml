name: Tomoe release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and application version
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml | Select-String '^version:\s*(\S+)'
          $version = $versionLine.Matches[0].Groups[1].Value.Split('+')[0]
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag must match pubspec.yaml version: v$version"
          }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress -y
      - run: flutter pub get --enforce-lockfile
      - name: Audit visual assets
        run: python tool/audit_visual_assets.py
      - run: flutter analyze --no-pub --no-fatal-infos --fatal-warnings
      - run: flutter test --no-pub --reporter expanded
      - name: Build Windows portable app
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
        run: flutter build windows --release --no-pub --dart-define="DANDANAPI_APPID=$env:DANDANAPI_APPID" --dart-define="DANDANAPI_KEY=$env:DANDANAPI_KEY"
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = 'dist/Tomoe_windows_x64_{0}.zip' -f $env:GITHUB_REF_NAME
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $archive
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip
          if-no-files-found: error

  android:
    if: vars.ENABLE_ANDROID_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Configure our release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/tomoe-release.jks
          printf 'storeFile=tomoe-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - run: flutter pub get --enforce-lockfile
      - name: Build universal APK
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
        run: flutter build apk --release --no-pub --dart-define="DANDANAPI_APPID=$DANDANAPI_APPID" --dart-define="DANDANAPI_KEY=$DANDANAPI_KEY"
      - name: Package Android
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Tomoe_android_${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [windows, android]
    if: always() && needs.windows.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: 同映 Tomoe ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
