name: 同映问题反馈
description: 报告同映的问题或规则兼容情况。
title: '[BUG] '
body:
  - type: markdown
    attributes:
      value: |
        同映基于 Predidit/Kazumi 独立维护。感谢原作者与贡献者，请先在本仓库反馈本分支的问题。
        请勿提交房间密码、访问令牌等私密信息。
  - type: input
    id: version
    attributes:
      label: 同映版本与规则 API
      description: 可在“关于”页面查看。
      placeholder: 1.0.0 / API 9
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 系统与设备
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: 规则名称与版本
      description: 与规则或一起看相关时填写；使用镜像时请注明。
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、期望行为与实际结果
      description: 一起看问题请同时说明房主/成员、控制模式及两边版本。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误信息或日志
